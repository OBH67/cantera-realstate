<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#081726;color:#0B1B2B;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0B1B2B;text-decoration:none}
a:hover{color:#A98A52}
::selection{background:#A98A52;color:#FFFFFF}
img{display:block}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.16)}}
@keyframes ping{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.85);opacity:0}}
@keyframes riseIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes lineIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@media (prefers-reduced-motion: reduce){[data-motion]{animation:none !important}}
@media (max-width:719px){[data-desk]{display:none !important}}
</style>
</helmet>

<div id="siteLayer" style="opacity:0;transition:opacity .5s ease">
  <dc-import name="Cantera Home" hint-size="100%,100vh"></dc-import>
</div>

<div id="curtain" style="position:fixed;inset:0;z-index:100;overflow:hidden;background:#081726;transition:transform 1.15s cubic-bezier(.76,0,.24,1)">
  <div id="curtainMedia" style="position:absolute;inset:0;overflow:hidden">
    <img data-motion="1" src="https://images.unsplash.com/photo-1518005020951-eccb494ad742?q=80&amp;w=2600&amp;auto=format&amp;fit=crop" alt="Arquitectura corporativa contemporánea" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 22s ease-out both">
    <video id="introVideo" muted="{{ true }}" loop="{{ true }}" playsInline="{{ true }}" autoPlay="{{ true }}" preload="auto" src="https://videos.pexels.com/video-files/8302387/8302387-uhd_2732_1440_25fps.mp4" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease"></video>
  </div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,15,25,0.72) 0%,rgba(6,15,25,0.44) 45%,rgba(6,15,25,0.88) 100%)"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,rgba(6,15,25,0) 30%,rgba(6,15,25,0.6) 100%)"></div>

  <div id="curtainInner" style="position:absolute;inset:0;z-index:2;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(74px,10vh,96px) clamp(28px,6vw,64px) clamp(46px,7vh,72px);transition:transform 1.15s cubic-bezier(.76,0,.24,1),opacity .8s ease">
    <div data-motion="1" style="margin-top:auto;display:flex;align-items:center;gap:16px;animation:riseIn 1s cubic-bezier(.22,.61,.36,1) .1s both">
      <span data-motion="1" style="width:clamp(30px,6vw,60px);height:1px;background:rgba(201,169,106,0.9);display:block;transform-origin:right;animation:lineIn 1.1s cubic-bezier(.22,.61,.36,1) .5s both"></span>
      <span style="font-size:clamp(9px,1.1vw,11px);letter-spacing:0.34em;text-transform:uppercase;font-weight:700;color:#C9A96A;text-align:center">Querétaro · México</span>
      <span data-motion="1" style="width:clamp(30px,6vw,60px);height:1px;background:rgba(201,169,106,0.9);display:block;transform-origin:left;animation:lineIn 1.1s cubic-bezier(.22,.61,.36,1) .5s both"></span>
    </div>

    <h1 data-motion="1" style="margin:clamp(22px,3vw,34px) 0 0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(52px,min(15vw,19vh),190px);line-height:0.94;letter-spacing:0.06em;color:#FFFFFF;text-align:center;animation:riseIn 1.2s cubic-bezier(.22,.61,.36,1) .22s both">BEJAR CAPITAL </h1>

    <div data-motion="1" style="margin-top:clamp(14px,2vw,22px);font-size:clamp(9.5px,1.15vw,12px);letter-spacing:0.4em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,0.82);text-align:center;animation:riseIn 1.1s cubic-bezier(.22,.61,.36,1) .38s both">Inmobiliaria Corporativa</div>

    <p data-motion="1" style="margin:clamp(26px,3.4vw,40px) 0 0;max-width:44ch;font-size:clamp(14.5px,1.5vw,18px);line-height:1.75;font-weight:300;color:rgba(255,255,255,0.78);text-align:center;text-wrap:pretty;animation:riseIn 1.1s cubic-bezier(.22,.61,.36,1) .5s both">Activos comerciales e industriales para inversionistas que miden el largo plazo.</p>

    <div id="startWrap" data-motion="1" style="margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px;animation:riseIn 1.1s cubic-bezier(.22,.61,.36,1) .68s both;transition:opacity .5s ease">
      <button id="startBtn" onClick="{{ start }}" aria-label="Iniciar y entrar al sitio" style="position:relative;width:clamp(92px,min(13vw,17vh),132px);height:clamp(92px,min(13vw,17vh),132px);border-radius:50%;border:1px solid rgba(255,255,255,0.5);background:rgba(8,17,28,0.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#FFFFFF;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:background .35s ease,border-color .35s ease,color .35s ease,transform .35s ease" style-hover="background:#C9A96A;border-color:#C9A96A;color:#0B1B2B;transform:scale(1.05)">
        <span data-motion="1" style="position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(201,169,106,0.6);animation:ping 3s ease-out infinite;pointer-events:none"></span>
        <span style="font-size:11.5px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase">Iniciar</span>
        <svg data-motion="1" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="animation:bob 2.6s ease-in-out infinite"><path d="M12 5v13"></path><path d="m6 13 6 6 6-6"></path></svg>
      </button>
      <span style="font-size:9.5px;letter-spacing:0.26em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,0.55)">Entrar al sitio</span>
    </div>

    <div data-desk="1" style="position:absolute;bottom:clamp(30px,4vw,46px);left:clamp(28px,5vw,56px);font-size:10px;letter-spacing:0.2em;font-weight:500;color:rgba(255,255,255,0.5)">EST. 2008 — CORRETAJE INSTITUCIONAL</div>
    <div data-desk="1" style="position:absolute;bottom:clamp(30px,4vw,46px);right:clamp(28px,5vw,56px);display:flex;align-items:center;gap:12px">
      <span style="font-size:11px;font-weight:700;letter-spacing:0.14em;color:#C9A96A;border-bottom:1px solid #C9A96A;padding-bottom:2px">ES</span>
      <span style="font-size:11px;color:rgba(255,255,255,0.35)">/</span>
      <span style="font-size:11px;font-weight:500;letter-spacing:0.14em;color:rgba(255,255,255,0.55);cursor:pointer">EN</span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1440 }
}">
class Component extends DCLogic {
  renderVals() {
    return { start: () => this.start(), true: true };
  }
  componentDidMount() {
    this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.curtain = document.getElementById('curtain');
    this.inner = document.getElementById('curtainInner');
    this.site = document.getElementById('siteLayer');
    this.startWrap = document.getElementById('startWrap');
    this.opened = false;
    this._prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    window.scrollTo(0, 0);
    this.playVideo();
    this._onWheel = (e) => { if (!this.opened && e.deltaY > 24) this.start(); };
    window.addEventListener('wheel', this._onWheel, { passive: true });
    this._onKey = (e) => { if (!this.opened && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown')) this.start(); };
    window.addEventListener('keydown', this._onKey);
  }
  componentWillUnmount() {
    window.removeEventListener('wheel', this._onWheel);
    window.removeEventListener('keydown', this._onKey);
    document.body.style.overflow = this._prevOverflow || '';
    clearTimeout(this._t1);
    clearTimeout(this._t2);
  }
  playVideo() {
    const v = document.getElementById('introVideo');
    if (!v) return;
    if (this.reduced) { v.removeAttribute('src'); return; }
    v.addEventListener('playing', () => { v.style.opacity = '1'; });
    const p = v.play();
    if (p && p.catch) p.catch(() => {});
  }
  start() {
    if (this.opened) return;
    this.opened = true;
    document.body.style.overflow = this._prevOverflow || '';
    if (this.site) this.site.style.opacity = '1';
    if (this.startWrap) this.startWrap.style.opacity = '0';
    if (this.reduced) {
      if (this.curtain) { this.curtain.style.transition = 'opacity .3s ease'; this.curtain.style.opacity = '0'; }
      this._t2 = setTimeout(() => { if (this.curtain) this.curtain.style.display = 'none'; }, 320);
      return;
    }
    this._t1 = setTimeout(() => {
      if (this.inner) { this.inner.style.transform = 'translateY(-16%)'; this.inner.style.opacity = '0'; }
      if (this.curtain) this.curtain.style.transform = 'translateY(-101%)';
    }, 40);
    this._t2 = setTimeout(() => {
      if (this.curtain) { this.curtain.style.display = 'none'; this.curtain.style.pointerEvents = 'none'; }
    }, 1300);
  }
}
</script>
</body>
</html>
